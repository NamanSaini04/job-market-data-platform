# Company career boards collected daily (public job-board APIs, no key needed).
#
# Checked live on 13 Oct 2026. Numbers in comments are from that day:
#   uk = jobs with a UK location, uk_data = UK jobs matching a role family in roles.yaml
#
# Inclusion rule: a board is collected if it had >= 1 UK data role on the check date.
# One day is a noisy sample. Re-run scripts/verify_ats_slugs.py monthly and re-apply the rule.
#
# We collect the WHOLE board (not only UK data roles), because a job only counts as
# "closed" when it disappears from the full board. UK/role filtering happens in dbt.

companies:
  # --- Greenhouse: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true ---
  - {company: Monzo,       ats: greenhouse, slug: monzo,      status: verified}  # uk=53  uk_data=11
